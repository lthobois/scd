name: scd-mfa
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: scd-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SCD_MFA_ADMIN_PASSWORD:?Créer .env avec le script de préparation}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./novalys-realm.json:/opt/keycloak/data/import/novalys-realm.json:ro
